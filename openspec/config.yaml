schema: spec-driven

# Project context shown to AI when creating artifacts.
context: |
  Product: "Meltemi Diagrams" (decided 2026-10-10, decision 0009; part of the Meltemi family;
  repo folder "dac" = diagrams as code; the proposal calls it "Architecture Studio"). Files use
  the `.meltemi` extension, the CLI is `meltemi-diagrams` (alias `mdg`) and the npm packages are
  `@meltemi/diagrams-*` (decision 0002).
  An open platform to create professional diagrams from code, adjust their visual
  composition on a canvas, and export them as images, interactive documentation and
  animated explanations. Source of truth for scope and decisions:
  propuesta-detallada-diagramas-como-codigo.docx/.pdf (Spanish, 2026-10-09,
  Proposal 1.0, language 0.2). Read it before proposing anything that changes scope.

  Audience: software/solution architects, tech leads, consultants, platform teams
  documenting systems of 10-30 components, reviewed in Git, used in meetings,
  documents and presentations.

  Product decisions (fixed):
  - MIT license for our own code (language, engine, editor, CLI, player, exporters).
    Dependencies, fonts and icon packs keep their own licenses; keep an inventory.
  - Fully local workflow: real folders, Git, export with no mandatory account/service.
  - Bidirectional editing (text <-> canvas) and animation are part of 1.0.
  - Separate model, view, placement (layout) and narrative (stories); stable IDs so
    manual adjustments survive edits and versions.
  - AI assistance is optional and only produces reviewable source changes.
  - Out of 1.0: realtime collaboration, synthetic voice, AI video, universal import,
    full editable PPTX shapes.

  Language ".meltemi" (proposed syntax 0.2, JSON as interchange):
  - Header `language "0.2"`. Blocks: model, `diagram <id>: <type> { }`, placement,
    style/theme, animate, story, export. Types: flow, sequence, c4, free.
  - IDs separate from labels; quoted strings; braces for blocks; explicit time units
    (ms, s); one statement per line, `;` allows several; continuation inside lists
    and parentheses; comments `//` and `/* */`.
  - Relation names optional; `as <id>` names a relation; the editor materializes
    stable IDs when needed. Compiling NEVER modifies the file.
  - flow/free: `->` solid directed, `-->` dashed. sequence: `->` call, `-->` reply,
    async via `kind async`. Unknown properties or missing references are errors with
    precise source locations.
  - placement: `place <id> at (x, y)`, `size <id> (w, h)`,
    `route <rel> from a.east to b.west via [(x, y)]`, `label <rel> at 50% offset (0, -16)`.
  - Layout modes: auto (engine positions everything), assisted (fixed positions
    respected, rest arranged), manual (nothing moved; strict export needs all
    positions). Soft suggestions vs strong constraints; conflicts produce diagnostics,
    never silent moves.

  Architecture (TypeScript engine independent of editor and input format):
  source + importers -> CST with source positions -> typed intermediate model +
  validation -> type-specific layout + constraints -> vector scene + state at time t
  -> editor / player / images / documents / video.
  Components: language (parser, diagnostics, formatter, editor services), model
  (IDs, relations, ordered events, views, references), layout (measures, ports,
  routes, constraints), render (SVG primitives, text, icons), motion (actions,
  scenes, deterministic clock), export (profiles, assets, frames, encoding).
  Candidates: ELK (EPL 2.0, behind a replaceable adapter), React Flow (interaction
  only), Motion Canvas (optional adapter), Playwright/Chromium (captures, PDF),
  FFmpeg (encoding, document binary/options). Remotion is NOT a core dependency.

  Editing contract: the text document is the source of truth. Canvas/timeline apply
  structured operations with stable IDs and a map between visual elements and text
  ranges. Edits are minimal CST changes that preserve comments and formatting
  (dragging a box must not reprint the file; full formatting is a separate action).
  Undo/redo is shared by text, canvas and animation. Invalid source shows the last
  valid compilation as stale. Deleting an entity detects references in views,
  styles and stories.

  Project layout on disk: plain directories, e.g. architecture/project.json,
  models/*.meltemi, diagrams/*.meltemi, stories/*.meltemi, themes/*.meltemi, assets/{icons,fonts,
  licenses.json}, assets.lock.json. Relative imports with explicit namespaces;
  module cycles rejected.

  Delivery: the whole 1.0 scope of the proposal is built now, as the ordered changes in
  docs/roadmap-1.0.md (each proposed, implemented, verified and archived in turn). Nothing in
  1.0 is deferred to a later phase. The product is built from scratch with no users, so changes
  never plan migrations, compatibility shims or deprecations; renames leave no traces outside
  decision records. The proposal's stages (1 contracts, 2 flow & free, 3 motion, 4 sequence & c4,
  5 integration, 6 release) only label the work.
  Gate before stabilising the grammar: drag, rename, reorder and connection edits
  must work without losing comments.

  Hosted service (decided 2026-10-13, decisions 0041 and 0042; post-1.0, outside the roadmap):
  the playground stays a static page that works with no account and sends nothing; an account
  is an optional layer, never a gate. `packages/cloud` (private, `@meltemi/diagrams-cloud`) is
  the Worker of diagrams.meltemi.dev on Cloudflare's free plan: it serves the playground's built
  site, an API on D1 and R2 (content-addressed blobs), and one Durable Object per project that
  holds the project as a Yjs document (approved download: `yjs`, MIT) and materialises it to
  files. Identity is the family's: id.meltemi.dev, specified in Meltemi Web (C:\meltemi\web;
  openspec change identity-service, spec identity-session); this repository consumes its
  contract through the reference verifier `@meltemi/identity`, which Meltemi Web publishes on
  npm (`packages/cloud` depends on `^0.2.0`), and never sees a provider token. Rules of that
  contract: check the Origin header on every state change
  (every host under meltemi.dev shares the session cookie and is the same site); never serve
  user-authored content (published catalogs) from a host under meltemi.dev: it goes to a
  separate registrable domain (PUBLISH_HOST, the owner's). Creating, editing and collaborating
  need an account; viewing by link does not. Permissions: link access (private | view | edit)
  times members by email (viewer | editor) plus the owner. Versions are explicit and capped;
  autosave never creates one. The CLI mirrors a repository into the cloud (login, push, pull,
  publish). Delivery (repositories on GitHub, pipelines, DNS, OAuth apps, secrets) is a separate
  change that starts once the functionality is validated locally (the owner's order of
  2026-10-13); the functional changes depend on nothing in the cloud: the Worker runs with
  `wrangler dev` on http://localhost:8788 (the identity service on http://localhost:8787 and
  the product site on http://localhost:8789, both from C:\meltemi\web) and tests use in-memory
  stores and sessions signed with test keys. The changes apply in this order: cloud-accounts,
  cloud-projects, sharing-and-permissions, live-collaboration, cli-cloud.

  Pending decisions to close with evidence (record each as a short decision note with
  criteria, alternatives and consequences): formal grammar details (cross-type
  linking, named ports, relative constraints, reusable styles, group semantics);
  parser approach chosen for incremental editing, error recovery and format
  preservation; layout engine chosen on a shared corpus; target app versions;
  importer coverage; initial icon packs; reference machine for performance targets.

  Engineering conventions: TypeScript strict, pnpm workspace monorepo under
  packages/*, vitest for tests, ESM, Node 22.12+ (TypeScript 6.0). Artifacts, code, identifiers and
  commit messages in English; product documents may be in Spanish. No data loss
  is the top quality bar: any defect that loses positions, references or comments
  needs a regression test.

# Per-artifact rules.
rules:
  proposal:
    - Always include a "Non-goals" section. It may only list the proposal's own 1.0 exclusions (synthetic voice, AI video, universal import, editable PPTX shapes, PPTX export), work that belongs to another change (of docs/roadmap-1.0.md or of the hosted service), naming that change, or the delivery change; never "later", "next increment" or "second phase"
    - State which proposal stage(s) the change covers and its number in docs/roadmap-1.0.md, or that it is a post-1.0 change outside the roadmap
    - No migration, deprecation or backward-compatibility content
  design:
    - Record every unresolved choice as a decision with alternatives and a recommendation
    - No "Migration Plan" section
    - Name the packages/modules touched and their public interfaces
  specs:
    - One capability per spec folder; requirements must be testable
    - Include at least one failure/diagnostic scenario per requirement that validates input
  tasks:
    - Tasks must be small (under ~2 hours) and verifiable by a test or command
    - Order tasks so a runnable vertical slice exists as early as possible
