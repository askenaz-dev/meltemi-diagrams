name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: "Successful main push CI run to deploy (must still be current main)"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false
  queue: max

jobs:
  authorize:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.ci.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: node scripts/ci-run.mjs

  # Production's twin first (change agent-mcp): the same approved source onto the staging Workers,
  # database and bucket that Meltemi Web's Terraform declares, then the MCP acceptance suite against
  # it. A failure of the suite fails this job, and production is not deployed.
  staging:
    needs: authorize
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      SECRETS_STORE_ID: ${{ vars.SECRETS_STORE_ID }}
      R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
      SECRETS_SUFFIX: ${{ vars.SECRETS_SUFFIX }}
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: delivery
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          fetch-depth: 0
          path: source
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: source/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - name: Verify source is on main history
        env:
          SOURCE_SHA: ${{ needs.authorize.outputs.sha }}
        run: git merge-base --is-ancestor "$SOURCE_SHA" origin/main
      - run: pnpm install --frozen-lockfile
      - name: Stamp the same source-ordered version without reserving a tag
        env:
          SOURCE_SHA: ${{ needs.authorize.outputs.sha }}
        run: node ../delivery/scripts/automatic-release.mjs stamp
      - run: pnpm skills:sync
      - name: The staging Workers' configurations with Terraform's ids
        run: node scripts/deploy-config.mjs --environment staging packages/cloud/wrangler.jsonc packages/cloud/wrangler.publish.jsonc
      - run: pnpm playground:build
      - name: Skip a source superseded by main before any mutation
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.authorize.outputs.sha }}
        run: node ../delivery/scripts/ci-run.mjs current
      - name: Migrations on the staging database
        if: steps.current.outputs.current == 'true'
        working-directory: source/packages/cloud
        run: pnpm exec wrangler d1 migrations apply DB --remote -c wrangler.deploy.json
      - name: The staging main Worker
        if: steps.current.outputs.current == 'true'
        working-directory: source/packages/cloud
        run: pnpm exec wrangler deploy -c wrangler.deploy.json
      - name: The staging publish Worker
        if: steps.current.outputs.current == 'true'
        working-directory: source/packages/cloud
        run: pnpm exec wrangler deploy -c wrangler.publish.deploy.json
      # Keep the readiness observation, but an unreachable host still fails complete acceptance.
      - name: Whether the staging host answers
        id: host
        if: steps.current.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ""
          MELTEMI_ORIGIN: https://staging.diagrams.meltemi.dev
        run: pnpm acceptance:mcp --probe
      - name: Prepare the staging OAuth acceptance fixtures
        id: fixtures
        if: steps.current.outputs.current == 'true'
        env:
          MELTEMI_ORIGIN: https://staging.diagrams.meltemi.dev
          MELTEMI_TOKEN: ${{ secrets.MELTEMI_TOKEN }}
          MELTEMI_TOKEN_2: ${{ secrets.MELTEMI_TOKEN_2 }}
        run: node --conditions=@meltemi/diagrams-source --import tsx packages/acceptance/src/mcp/oauth-fixtures-cli.ts setup --environment staging --file "$RUNNER_TEMP/mcp-oauth-staging.json"
      - name: The MCP acceptance suite on staging
        id: suite
        if: ${{ !cancelled() && steps.current.outputs.current == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ""
          CLOUDFLARE_API_KEY: ""
          CF_API_TOKEN: ""
          CF_API_KEY: ""
          MELTEMI_ORIGIN: https://staging.diagrams.meltemi.dev
          MELTEMI_TOKEN: ${{ secrets.MELTEMI_TOKEN }}
          MELTEMI_TOKEN_2: ${{ secrets.MELTEMI_TOKEN_2 }}
          MELTEMI_OAUTH_FIXTURES: ${{ runner.temp }}/mcp-oauth-staging.json
        run: pnpm acceptance:mcp --require-complete
      - name: Clean the staging OAuth acceptance fixtures
        id: cleanup
        if: ${{ always() && steps.current.outputs.current == 'true' }}
        env:
          MELTEMI_ORIGIN: https://staging.diagrams.meltemi.dev
        run: node --conditions=@meltemi/diagrams-source --import tsx packages/acceptance/src/mcp/oauth-fixtures-cli.ts cleanup --environment staging --file "$RUNNER_TEMP/mcp-oauth-staging.json" --summary .test-output/mcp-acceptance/oauth-fixture-cleanup.json
      - name: The suite's results on staging
        if: ${{ always() && steps.current.outputs.current == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: mcp-acceptance-staging
          path: source/.test-output/mcp-acceptance/
          if-no-files-found: ignore
      - name: Staging result
        if: ${{ !cancelled() }}
        env:
          CURRENT: ${{ steps.current.outputs.current }}
          SUITE: ${{ steps.suite.outcome }}
          CLEANUP: ${{ steps.cleanup.outcome }}
          SOURCE_SHA: ${{ needs.authorize.outputs.sha }}
        run: |
          if [ "$CURRENT" != true ]; then
            echo "Skipped $SOURCE_SHA on staging because main has advanced; no deployment mutation ran." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$SUITE" = success ] && [ "$CLEANUP" = success ]; then
            echo "Deployed $SOURCE_SHA to staging; all 34 MCP acceptance steps passed and the isolated OAuth fixtures were cleaned." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$SUITE" = failure ] || [ "$CLEANUP" = failure ]; then
            echo "Deployed $SOURCE_SHA to staging; complete MCP acceptance or fixture cleanup failed (artifact mcp-acceptance-staging records the result), so production is not deployed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The staging deployment of $SOURCE_SHA did not finish, so production is not deployed; see the failed step." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: [authorize, staging]
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      SECRETS_STORE_ID: ${{ vars.SECRETS_STORE_ID }}
      R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: delivery
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          fetch-depth: 0
          path: source
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: source/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - name: Verify source is on main history
        env:
          SOURCE_SHA: ${{ needs.authorize.outputs.sha }}
        run: git merge-base --is-ancestor "$SOURCE_SHA" origin/main
      - run: pnpm install --frozen-lockfile
      - name: Stamp the same source-ordered version without reserving a tag
        env:
          SOURCE_SHA: ${{ needs.authorize.outputs.sha }}
        run: node ../delivery/scripts/automatic-release.mjs stamp
      - run: pnpm skills:sync
      - name: The Workers' configurations with Terraform's ids
        run: node scripts/deploy-config.mjs packages/cloud/wrangler.jsonc packages/cloud/wrangler.publish.jsonc
      - run: pnpm playground:build
      - name: Skip a source superseded by main before any mutation
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.authorize.outputs.sha }}
        run: node ../delivery/scripts/ci-run.mjs current
      - name: Migrations
        if: steps.current.outputs.current == 'true'
        working-directory: source/packages/cloud
        run: pnpm exec wrangler d1 migrations apply DB --remote -c wrangler.deploy.json
      - name: The main Worker
        if: steps.current.outputs.current == 'true'
        working-directory: source/packages/cloud
        run: pnpm exec wrangler deploy -c wrangler.deploy.json
      - name: The publish Worker
        if: steps.current.outputs.current == 'true'
        working-directory: source/packages/cloud
        run: pnpm exec wrangler deploy -c wrangler.publish.deploy.json
      - name: Prepare the production OAuth acceptance fixtures
        id: fixtures
        if: steps.current.outputs.current == 'true'
        env:
          MELTEMI_ORIGIN: https://diagrams.meltemi.dev
          MELTEMI_TOKEN: ${{ secrets.MELTEMI_TOKEN }}
          MELTEMI_TOKEN_2: ${{ secrets.MELTEMI_TOKEN_2 }}
        run: node --conditions=@meltemi/diagrams-source --import tsx packages/acceptance/src/mcp/oauth-fixtures-cli.ts setup --environment production --file "$RUNNER_TEMP/mcp-oauth-production.json"
      # The acceptance process has no Cloudflare authority; cleanup restores it separately.
      - name: The MCP acceptance suite on production
        id: suite
        if: ${{ !cancelled() && steps.current.outputs.current == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ""
          CLOUDFLARE_API_KEY: ""
          CF_API_TOKEN: ""
          CF_API_KEY: ""
          MELTEMI_ORIGIN: https://diagrams.meltemi.dev
          MELTEMI_TOKEN: ${{ secrets.MELTEMI_TOKEN }}
          MELTEMI_TOKEN_2: ${{ secrets.MELTEMI_TOKEN_2 }}
          MELTEMI_OAUTH_FIXTURES: ${{ runner.temp }}/mcp-oauth-production.json
        run: pnpm acceptance:mcp --require-complete
      - name: Clean the production OAuth acceptance fixtures
        id: cleanup
        if: ${{ always() && steps.current.outputs.current == 'true' }}
        env:
          MELTEMI_ORIGIN: https://diagrams.meltemi.dev
        run: node --conditions=@meltemi/diagrams-source --import tsx packages/acceptance/src/mcp/oauth-fixtures-cli.ts cleanup --environment production --file "$RUNNER_TEMP/mcp-oauth-production.json" --summary .test-output/mcp-acceptance/oauth-fixture-cleanup.json
      - name: The suite's results on production
        if: ${{ always() && steps.current.outputs.current == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: mcp-acceptance-production
          path: source/.test-output/mcp-acceptance/
          if-no-files-found: ignore
      - name: Deployment result
        if: ${{ !cancelled() }}
        env:
          CURRENT: ${{ steps.current.outputs.current }}
          SUITE: ${{ steps.suite.outcome }}
          CLEANUP: ${{ steps.cleanup.outcome }}
          SOURCE_SHA: ${{ needs.authorize.outputs.sha }}
        run: |
          if [ "$CURRENT" != true ]; then
            echo "Skipped $SOURCE_SHA because main has advanced; no deployment mutation ran." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$SUITE" = success ] && [ "$CLEANUP" = success ]; then
            echo "Deployed CI-verified source $SOURCE_SHA; all 34 MCP acceptance steps passed and the isolated OAuth fixtures were cleaned." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$SUITE" = failure ] || [ "$CLEANUP" = failure ]; then
            echo "Deployed CI-verified source $SOURCE_SHA, but complete MCP acceptance or fixture cleanup failed (artifact mcp-acceptance-production records the result). Production stays as deployed: revert on main through CI, or roll the Worker back on Cloudflare with the owner (RELEASING.md)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The deployment of $SOURCE_SHA did not finish; see the failed step." >> "$GITHUB_STEP_SUMMARY"
          fi
