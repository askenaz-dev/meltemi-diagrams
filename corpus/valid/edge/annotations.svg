<svg xmlns="http://www.w3.org/2000/svg" width="862" height="563" viewBox="0 0 862 563" font-family="&quot;IBM Plex Sans&quot;, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif">
  <title>Annotations</title>
  <desc>Order service with its data stores, a review step and operator notes.</desc>
  <rect x="0" y="0" width="862" height="563" fill="#ffffff"/>
  <g data-id="platform" data-role="element">
    <rect x="188" y="20" width="484" height="523" rx="10" fill="#eef6f9" stroke="#2f7f9c" stroke-width="1"/>
    <text x="208" y="42.19" text-anchor="start" font-size="12" font-weight="600" fill="#144a5e">Platform</text>
    <text x="208" y="57.84" text-anchor="start" font-size="11" font-weight="400" fill="#144a5e">Everything the team operates</text>
  </g>
  <g data-id="storage" data-role="element">
    <rect x="204" y="316" width="452" height="120" rx="10" fill="none" stroke="#2f7f9c" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="224" y="338.19" text-anchor="start" font-size="12" font-weight="600" fill="#1b1f23">Storage</text>
  </g>
  <g data-id="api" data-role="element">
    <rect x="320" y="60" width="200" height="56" rx="6" fill="#ffffff" stroke="#c7cdd2" stroke-width="1"/>
    <text x="420" y="84.54" text-anchor="middle" font-size="13" font-weight="600" fill="#1b1f23">Order API</text>
    <text x="420" y="101.84" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6570">REST · validates input</text>
  </g>
  <g data-id="review" data-role="element">
    <path d="M380 188 L460 228 L380 268 L300 228 Z" fill="#ffffff" stroke="#c7cdd2" stroke-width="1"/>
    <text x="380" y="232.54" text-anchor="middle" font-size="13" font-weight="600" fill="#1b1f23">Needs review?</text>
  </g>
  <g data-id="orders" data-role="element">
    <path d="M220 364 L220 412 A80 8 0 0 0 380 412 L380 364 A80 8 0 0 1 220 364 Z" fill="#ffffff" stroke="#c7cdd2" stroke-width="1"/>
    <path d="M220 364 A80 8 0 0 1 380 364 A80 8 0 0 1 220 364 Z" fill="#ffffff" stroke="#c7cdd2" stroke-width="1"/>
    <text x="300" y="388.54" text-anchor="middle" font-size="13" font-weight="600" fill="#1b1f23">Orders DB</text>
    <text x="300" y="405.84" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6570">PostgreSQL</text>
  </g>
  <g data-id="cache" data-role="element">
    <path d="M480 364 L480 412 A80 8 0 0 0 640 412 L640 364 A80 8 0 0 1 480 364 Z" fill="#ffffff" stroke="#c7cdd2" stroke-width="1"/>
    <path d="M480 364 A80 8 0 0 1 640 364 A80 8 0 0 1 480 364 Z" fill="#ffffff" stroke="#c7cdd2" stroke-width="1"/>
    <text x="560" y="388.54" text-anchor="middle" font-size="13" font-weight="600" fill="#1b1f23">Cache</text>
    <text x="560" y="405.84" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6570">Redis · TTL</text>
  </g>
  <g data-id="limits" data-role="element">
    <text x="373.5" y="481.84" text-anchor="start" font-size="11" font-weight="400" fill="#5b6570">Limits to confirm</text>
    <text x="373.5" y="499.84" text-anchor="start" font-size="11" font-weight="400" fill="#5b6570">500 rps per tenant</text>
    <text x="373.5" y="517.84" text-anchor="start" font-size="11" font-weight="400" fill="#5b6570">Retention: 90 days</text>
    <polyline points="388.36,469 334.06,419.22" fill="none" stroke="#5b6570" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="0 4.5" class="leader"/>
  </g>
  <g data-id="client" data-role="element">
    <rect x="20" y="60" width="160" height="56" rx="6" fill="#ffffff" stroke="#c7cdd2" stroke-width="1"/>
    <text x="100" y="84.54" text-anchor="middle" font-size="13" font-weight="600" fill="#1b1f23">Client app</text>
    <text x="100" y="101.84" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6570">web &amp; mobile &lt;beta&gt;</text>
  </g>
  <g data-id="audit" data-role="element">
    <rect x="685" y="196" width="150" height="64" rx="6" fill="#fde9e0" stroke="#c4552c" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="760" y="216.54" text-anchor="middle" font-size="13" font-weight="600" fill="#7a2e12">Audit log</text>
    <text x="760" y="233.84" text-anchor="middle" font-size="11" font-weight="400" fill="#7a2e12">append only</text>
    <text x="760" y="249.84" text-anchor="middle" font-size="11" font-weight="400" fill="#7a2e12">proposed</text>
  </g>
  <g data-id="request" data-role="relation">
    <polyline points="180,88 320,88" fill="none" stroke="#5b6570" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
    <polyline points="313,91.06 320,88 313,84.94" fill="none" stroke="#5b6570" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
    <g data-id="request" data-role="label">
      <rect x="240.7" y="79" width="18.6" height="18" rx="9" fill="#1b1f23" stroke="#1b1f23" stroke-width="1"/>
      <text x="250" y="91.84" text-anchor="middle" font-size="11" font-weight="500" fill="#ffffff">1</text>
    </g>
  </g>
  <g data-id="check" data-role="relation">
    <polyline points="390,116 390,193" fill="none" stroke="#5b6570" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
    <polyline points="386.94,186 390,193 393.06,186" fill="none" stroke="#5b6570" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
    <g data-id="check" data-role="label">
      <rect x="396.7" y="145.5" width="18.6" height="18" rx="9" fill="#1b1f23" stroke="#1b1f23" stroke-width="1"/>
      <text x="406" y="158.34" text-anchor="middle" font-size="11" font-weight="500" fill="#ffffff">2</text>
    </g>
  </g>
  <g data-id="persist" data-role="relation">
    <polyline points="340,248 340,357.07" fill="none" stroke="#5b6570" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
    <polyline points="336.94,350.07 340,357.07 343.06,350.07" fill="none" stroke="#5b6570" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
    <g data-id="persist" data-role="label">
      <rect x="314.7" y="282.63" width="18.6" height="18" rx="9" fill="#1b1f23" stroke="#1b1f23" stroke-width="1"/>
      <text x="324" y="295.47" text-anchor="middle" font-size="11" font-weight="500" fill="#ffffff">3</text>
    </g>
  </g>
  <g data-id="skip" data-role="relation">
    <polyline points="460,228 600,228 685,228" fill="none" stroke="#5b6570" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 4"/>
    <polyline points="678,231.06 685,228 678,224.94" fill="none" stroke="#5b6570" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
    <g data-id="skip" data-role="label">
      <rect x="560.21" y="219" width="24.58" height="18" rx="9" fill="#ffffff" stroke="#c7cdd2" stroke-width="1"/>
      <text x="572.5" y="231.84" text-anchor="middle" font-size="11" font-weight="500" fill="#1b1f23">no</text>
    </g>
  </g>
  <g data-id="warm" data-role="relation">
    <polyline points="520,88 560,88 560,356" fill="none" stroke="#2f7f9c" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
    <polyline points="556.94,349 560,356 563.06,349" fill="none" stroke="#2f7f9c" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
  <g data-id="hit" data-role="relation">
    <polyline points="500,358.73 500,116" fill="none" stroke="#5b6570" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
    <polyline points="503.06,123 500,116 496.94,123" fill="none" stroke="#5b6570" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
  <g data-id="tJwt" data-role="element">
    <rect x="481.5" y="51" width="37" height="18" rx="9" fill="#6a4fd0" stroke="#6a4fd0" stroke-width="1"/>
    <text x="500" y="63.64" text-anchor="middle" font-size="10.5" font-weight="500" font-family="ui-monospace, &quot;Cascadia Mono&quot;, Consolas, &quot;Liberation Mono&quot;, Menlo, monospace" fill="#ffffff">JWT</text>
  </g>
  <g data-id="tBeta" data-role="element">
    <rect x="798.5" y="189" width="43" height="18" rx="9" fill="#6a4fd0" stroke="#6a4fd0" stroke-width="1"/>
    <text x="820" y="201.64" text-anchor="middle" font-size="10.5" font-weight="500" font-family="ui-monospace, &quot;Cascadia Mono&quot;, Consolas, &quot;Liberation Mono&quot;, Menlo, monospace" fill="#ffffff">BETA</text>
  </g>
</svg>
