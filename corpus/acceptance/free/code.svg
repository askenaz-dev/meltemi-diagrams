    <text x="57.5" y="203.81" text-anchor="start" font-size="11" font-weight="400" font-family="ui-monospace, &quot;Cascadia Mono&quot;, Consolas, &quot;Liberation Mono&quot;, Menlo, monospace" fill="#1f2328">func handle() {</text>
    <text x="57.5" y="221.81" text-anchor="start" font-size="11" font-weight="400" font-family="ui-monospace, &quot;Cascadia Mono&quot;, Consolas, &quot;Liberation Mono&quot;, Menlo, monospace" fill="#1f2328" xml:space="preserve">    if ok {</text>
    <text x="57.5" y="239.81" text-anchor="start" font-size="11" font-weight="400" font-family="ui-monospace, &quot;Cascadia Mono&quot;, Consolas, &quot;Liberation Mono&quot;, Menlo, monospace" fill="#1f2328" xml:space="preserve">        return</text>
    <text x="57.5" y="257.81" text-anchor="start" font-size="11" font-weight="400" font-family="ui-monospace, &quot;Cascadia Mono&quot;, Consolas, &quot;Liberation Mono&quot;, Menlo, monospace" fill="#1f2328" xml:space="preserve">    }</text>
    <text x="57.5" y="275.81" text-anchor="start" font-size="11" font-weight="400" font-family="ui-monospace, &quot;Cascadia Mono&quot;, Consolas, &quot;Liberation Mono&quot;, Menlo, monospace" fill="#1f2328">}</text>
  </g>
  <g data-id="config" data-role="element">
    <rect x="20" y="358" width="172" height="76" rx="4" fill="#0b1830" stroke="#22d3ee" stroke-width="1"/>
    <text x="32" y="380.16" text-anchor="start" font-size="12" font-weight="400" font-family="ui-monospace, &quot;Cascadia Mono&quot;, Consolas, &quot;Liberation Mono&quot;, Menlo, monospace" fill="#e6edf3" xml:space="preserve">retries:  3</text>
    <text x="32" y="400.16" text-anchor="start" font-size="12" font-weight="400" font-family="ui-monospace, &quot;Cascadia Mono&quot;, Consolas, &quot;Liberation Mono&quot;, Menlo, monospace" fill="#e6edf3" xml:space="preserve">timeout:  30s</text>
    <text x="32" y="420.16" text-anchor="start" font-size="12" font-weight="400" font-family="ui-monospace, &quot;Cascadia Mono&quot;, Consolas, &quot;Liberation Mono&quot;, Menlo, monospace" fill="#e6edf3" xml:space="preserve">backoff:  exponential</text>
  </g>
  <g data-id="cut" data-role="element">
    <rect x="426.5" y="372" width="199" height="88" rx="8" fill="#f3f5f8" stroke="#DCE5ED" stroke-width="1"/>
    <text x="438.5" y="392.81" text-anchor="start" font-size="11" font-weight="400" font-family="ui-monospace, &quot;Cascadia Mono&quot;, Consolas, &quot;Liberation Mono&quot;, Menlo, monospace" fill="#1f2328">SELECT id, name, created_at</text>
    <text x="438.5" y="410.81" text-anchor="start" font-size="11" font-weight="400" font-family="ui-monospace, &quot;Cascadia Mono&quot;, Consolas, &quot;Liberation Mono&quot;, Menlo, monospace" fill="#1f2328" xml:space="preserve">  FROM users</text>
    <text x="438.5" y="428.81" text-anchor="start" font-size="11" font-weight="400" font-family="ui-monospace, &quot;Cascadia Mono&quot;, Consolas, &quot;Liberation Mono&quot;, Menlo, monospace" fill="#1f2328" xml:space="preserve"> WHERE active = true</text>
    <text x="438.5" y="446.81" text-anchor="start" font-size="11" font-weight="400" font-family="ui-monospace, &quot;Cascadia Mono&quot;, Consolas, &quot;Liberation Mono&quot;, Menlo, monospace" fill="#1f2328" xml:space="preserve"> ORDER BY created_at DESC;</text>
  </g>
