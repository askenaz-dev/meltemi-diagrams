<svg xmlns="http://www.w3.org/2000/svg" width="686" height="524" viewBox="0 0 686 524" font-family="&quot;Inter&quot;, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif">
  <title>Code notes</title>
  <defs>
    <linearGradient id="meltemi-wind" gradientUnits="userSpaceOnUse" x1="38" y1="222" x2="219" y2="54">
      <stop offset="0" stop-color="#1D4ED8"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="686" height="524" fill="#F7FBFF"/>
