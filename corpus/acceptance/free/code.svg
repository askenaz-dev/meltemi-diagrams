    <text x="318" y="165.81" text-anchor="start" font-size="11" font-weight="400" font-family="ui-monospace, &quot;Cascadia Mono&quot;, Consolas, &quot;Liberation Mono&quot;, Menlo, monospace" fill="#1f2328">exports.onExecutePostLogin = async (event, api) =&gt; {</text>
    <text x="318" y="183.81" text-anchor="start" font-size="11" font-weight="400" font-family="ui-monospace, &quot;Cascadia Mono&quot;, Consolas, &quot;Liberation Mono&quot;, Menlo, monospace" fill="#1f2328" xml:space="preserve">  if (event.client.client_id !== &quot;CLIENT_ID_WEB&quot;) {</text>
    <text x="318" y="201.81" text-anchor="start" font-size="11" font-weight="400" font-family="ui-monospace, &quot;Cascadia Mono&quot;, Consolas, &quot;Liberation Mono&quot;, Menlo, monospace" fill="#1f2328" xml:space="preserve">    return;</text>
    <text x="318" y="219.81" text-anchor="start" font-size="11" font-weight="400" font-family="ui-monospace, &quot;Cascadia Mono&quot;, Consolas, &quot;Liberation Mono&quot;, Menlo, monospace" fill="#1f2328" xml:space="preserve">  }</text>
    <text x="318" y="237.81" text-anchor="start" font-size="11" font-weight="400" font-family="ui-monospace, &quot;Cascadia Mono&quot;, Consolas, &quot;Liberation Mono&quot;, Menlo, monospace" fill="#1f2328"></text>
    <text x="318" y="255.81" text-anchor="start" font-size="11" font-weight="400" font-family="ui-monospace, &quot;Cascadia Mono&quot;, Consolas, &quot;Liberation Mono&quot;, Menlo, monospace" fill="#1f2328" xml:space="preserve">  // Aplicar lógica específica de la app web.</text>
    <text x="318" y="273.81" text-anchor="start" font-size="11" font-weight="400" font-family="ui-monospace, &quot;Cascadia Mono&quot;, Consolas, &quot;Liberation Mono&quot;, Menlo, monospace" fill="#1f2328">};</text>
    <polyline points="344,145 238,92" fill="none" stroke="#526579" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="0 4.5" class="leader"/>
  </g>
