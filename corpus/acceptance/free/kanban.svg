    <text x="132" y="245.92" text-anchor="middle" font-size="15.6" font-weight="400" fill="#1f2328">Dark mode for</text>
    <text x="132" y="265.42" text-anchor="middle" font-size="15.6" font-weight="400" fill="#1f2328">the settings page</text>
