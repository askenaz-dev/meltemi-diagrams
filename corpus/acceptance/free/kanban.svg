<svg xmlns="http://www.w3.org/2000/svg" width="1008" height="770" viewBox="0 0 1008 770" font-family="&quot;Inter&quot;, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif">
  <title>Release board</title>
  <defs>
    <linearGradient id="meltemi-wind" gradientUnits="userSpaceOnUse" x1="38" y1="222" x2="219" y2="54">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1008" height="770" fill="#07111F"/>
  <g data-id="board" data-role="element">
    <rect x="20" y="114" width="968" height="592" rx="14" fill="#0B1830" stroke="#183149" stroke-width="1"/>
  </g>
  <g data-id="backlog" data-role="element">
    <rect x="36" y="130" width="192" height="560" rx="14" fill="#0B1830" stroke="#183149" stroke-width="1"/>
    <text x="56" y="152.73" text-anchor="start" font-size="13" font-weight="600" fill="#F7FBFF">Backlog</text>
  </g>
  <g data-id="todo" data-role="element">
    <rect x="284" y="130" width="192" height="560" rx="14" fill="#0B1830" stroke="#183149" stroke-width="1"/>
