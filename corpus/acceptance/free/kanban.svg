  </g>
  <g data-id="doing" data-role="element">
    <rect x="532" y="130" width="192" height="560" rx="14" fill="#0B1830" stroke="#183149" stroke-width="1"/>
    <text x="552" y="152.73" text-anchor="start" font-size="13" font-weight="600" fill="#F7FBFF">Doing</text>
  </g>
  <g data-id="done" data-role="element">
