<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="923" viewBox="0 0 1640 923" font-family="&quot;Inter&quot;, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif">
  <title>Arquitectura de referencia para pagos con tarjeta</title>
  <defs>
    <linearGradient id="meltemi-wind" gradientUnits="userSpaceOnUse" x1="38" y1="222" x2="219" y2="54">
      <stop offset="0" stop-color="#1D4ED8"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1640" height="923" fill="#F7FBFF"/>
  <g data-id="heading" data-role="element">
    <text x="570" y="69.64" text-anchor="start" font-size="21" font-weight="600" fill="#0B1830">Arquitectura de referencia para pagos con tarjeta</text>
  </g>
  <g data-id="subtitle" data-role="element">
    <text x="423.5" y="129.64" text-anchor="start" font-size="21" font-weight="600" fill="#0B1830">Del comercio al banco emisor, con conciliación diaria y devoluciones parciales</text>
  </g>
  <g data-id="merchant" data-role="element">
    <rect x="20" y="394" width="360" height="96" rx="8" fill="#FFFFFF" stroke="#DCE5ED" stroke-width="1"/>
    <text x="200" y="438.73" text-anchor="middle" font-size="13" font-weight="600" fill="#0B1830">Terminal del comercio en tienda</text>
    <text x="200" y="456" text-anchor="middle" font-size="11" font-weight="400" fill="#526579">Lee la tarjeta y firma el cargo</text>
  </g>
  <g data-id="gateway" data-role="element">
    <rect x="640" y="394" width="360" height="96" rx="8" fill="#FFFFFF" stroke="#DCE5ED" stroke-width="1"/>
    <text x="820" y="438.73" text-anchor="middle" font-size="13" font-weight="600" fill="#0B1830">Pasarela de autorización y riesgo</text>
    <text x="820" y="456" text-anchor="middle" font-size="11" font-weight="400" fill="#526579">Valida firmas, límites y fraude</text>
  </g>
  <g data-id="issuer" data-role="element">
    <rect x="1260" y="394" width="360" height="96" rx="8" fill="#FFFFFF" stroke="#DCE5ED" stroke-width="1"/>
    <text x="1440" y="438.73" text-anchor="middle" font-size="13" font-weight="600" fill="#0B1830">Banco emisor de la tarjeta</text>
    <text x="1440" y="456" text-anchor="middle" font-size="11" font-weight="400" fill="#526579">Autoriza o rechaza el cargo</text>
  </g>
  <g data-id="ledger" data-role="element">
    <rect x="620" y="734" width="400" height="96" rx="8" fill="#FFFFFF" stroke="#DCE5ED" stroke-width="1"/>
    <text x="820" y="778.73" text-anchor="middle" font-size="13" font-weight="600" fill="#0B1830">Libro mayor de conciliación diaria</text>
    <text x="820" y="796" text-anchor="middle" font-size="11" font-weight="400" fill="#526579">Cuadra cada liquidación</text>
  </g>
  <g data-id="send" data-role="relation">
    <polyline points="380,442 632,442" fill="none" stroke="#526579" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M640 442 L632 445.5 L632 438.5 Z" fill="#526579" stroke="none" stroke-width="0"/>
    <g data-id="send" data-role="label">
      <rect x="445.26" y="433" width="129.49" height="18" rx="9" fill="#FFFFFF" stroke="#DCE5ED" stroke-width="1"/>
      <text x="510" y="446" text-anchor="middle" font-size="11" font-weight="500" fill="#0B1830">Envía el cargo firmado</text>
    </g>
  </g>
  <g data-id="authorize" data-role="relation">
    <polyline points="1000,442 1252,442" fill="none" stroke="#526579" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M1260 442 L1252 445.5 L1252 438.5 Z" fill="#526579" stroke="none" stroke-width="0"/>
    <g data-id="authorize" data-role="label">
      <rect x="1046.47" y="433" width="167.05" height="18" rx="9" fill="#FFFFFF" stroke="#DCE5ED" stroke-width="1"/>
      <text x="1130" y="446" text-anchor="middle" font-size="11" font-weight="500" fill="#0B1830">Pide la autorización del titular</text>
    </g>
  </g>
  <g data-id="record" data-role="relation">
    <polyline points="820,490 820,726" fill="none" stroke="#526579" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M820 734 L816.5 726 L823.5 726 Z" fill="#526579" stroke="none" stroke-width="0"/>
    <g data-id="record" data-role="label">
      <rect x="724.33" y="603" width="191.35" height="18" rx="9" fill="#FFFFFF" stroke="#DCE5ED" stroke-width="1"/>
      <text x="820" y="616" text-anchor="middle" font-size="11" font-weight="500" fill="#0B1830">Registra el resultado y la comisión</text>
    </g>
  </g>
  <g data-id="frame" data-role="frame">
    <polyline points="20,879.5 1620,879.5" fill="none" stroke="#DCE5ED" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
    <g data-id="mark" data-role="frame" transform="translate(20 889) scale(0.0938)">
      <path d="M43 178C43 125 57 100 78 100C99 100 109 127 109 176C109 105 132 67 158 67C185 67 199 97 196 132C194 154 185 169 172 177C189 176 205 166 217 152C224 144 230 133 234 122" fill="none" stroke="url(#meltemi-wind)" stroke-width="25" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M45 199C87 211 145 215 202 189C195 204 177 216 151 220C106 226 67 215 45 199Z" fill="url(#meltemi-wind)" stroke="none" stroke-width="0"/>
    </g>
    <text x="52" y="905.37" text-anchor="start" font-size="12" font-weight="600" fill="#0B1830">Meltemi Diagrams</text>
    <text x="1620" y="905" text-anchor="end" font-size="11" font-weight="400" fill="#526579">Arquitectura de referencia para pagos con tarjeta</text>
  </g>
</svg>
