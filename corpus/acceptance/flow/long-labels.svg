<svg xmlns="http://www.w3.org/2000/svg" width="3138" height="234" viewBox="0 0 3138 234" font-family="&quot;Inter&quot;, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif">
  <title>Integración de pagos con proveedores externos</title>
  <desc>Cada etiqueta es más larga que una caja por omisión</desc>
  <defs>
    <linearGradient id="meltemi-wind" gradientUnits="userSpaceOnUse" x1="38" y1="222" x2="219" y2="54">
      <stop offset="0" stop-color="#1D4ED8"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="3138" height="234" fill="#F7FBFF"/>
  <g data-id="customer" data-role="element">
    <rect x="20" y="33.33" width="294" height="56" rx="8" fill="#FFFFFF" stroke="#DCE5ED" stroke-width="1"/>
    <text x="167" y="58.06" text-anchor="middle" font-size="13" font-weight="600" fill="#0B1830">Cliente con cuenta empresarial verificada</text>
    <text x="167" y="75.33" text-anchor="middle" font-size="11" font-weight="400" fill="#526579">Compra desde la aplicación móvil o la web</text>
  </g>
  <g data-id="gateway" data-role="element">
    <rect x="775" y="33.33" width="282" height="56" rx="8" fill="#FFFFFF" stroke="#DCE5ED" stroke-width="1"/>
    <text x="916" y="58.06" text-anchor="middle" font-size="13" font-weight="600" fill="#0B1830">API Gateway de pagos y autorización</text>
    <text x="916" y="75.33" text-anchor="middle" font-size="11" font-weight="400" fill="#526579">Valida firmas, límites y la identidad del comercio</text>
  </g>
  <g data-id="review" data-role="element">
    <path d="M1565.5 21.33 L1755 61.33 L1565.5 101.33 L1376 61.33 Z" fill="#FFFFFF" stroke="#DCE5ED" stroke-width="1"/>
    <text x="1565.5" y="66.06" text-anchor="middle" font-size="13" font-weight="600" fill="#0B1830">¿Requiere revisión manual por cumplimiento?</text>
  </g>
  <g data-id="provider" data-role="element">
    <rect x="2179" y="20" width="324" height="56" rx="8" fill="#FFFFFF" stroke="#DCE5ED" stroke-width="1"/>
    <text x="2341" y="52.73" text-anchor="middle" font-size="13" font-weight="600" fill="#0B1830">Proveedor externo de tarjetas y transferencias</text>
  </g>
  <g data-id="ledger" data-role="element">
    <path d="M2825 34.67 L2825 82.67 A146.5 8 0 0 0 3118 82.67 L3118 34.67 A146.5 8 0 0 1 2825 34.67 Z" fill="#FFFFFF" stroke="#DCE5ED" stroke-width="1"/>
    <path d="M2825 34.67 A146.5 8 0 0 1 3118 34.67 A146.5 8 0 0 1 2825 34.67 Z" fill="#FFFFFF" stroke="#DCE5ED" stroke-width="1"/>
    <text x="2971.5" y="59.4" text-anchor="middle" font-size="13" font-weight="600" fill="#0B1830">Libro mayor de transacciones conciliadas</text>
    <text x="2971.5" y="76.67" text-anchor="middle" font-size="11" font-weight="400" fill="#526579">PostgreSQL con réplicas de lectura</text>
  </g>
  <g data-id="audit" data-role="element">
    <text x="59" y="142.33" text-anchor="start" font-size="11" font-weight="400" fill="#526579">Toda decisión de riesgo queda registrada</text>
    <text x="59" y="160.33" text-anchor="start" font-size="11" font-weight="400" fill="#526579">con su motivo y su autor</text>
  </g>
  <g data-id="authorize" data-role="relation">
    <polyline points="314,61.33 767,61.33" fill="none" stroke="#526579" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M775 61.33 L767 64.83 L767 57.83 Z" fill="#526579" stroke="none" stroke-width="0"/>
    <g data-id="authorize" data-role="label">
      <rect x="384.09" y="52.33" width="320.83" height="18" rx="9" fill="#FFFFFF" stroke="#DCE5ED" stroke-width="1"/>
      <text x="544.5" y="65.33" text-anchor="middle" font-size="11" font-weight="500" fill="#0B1830">Solicita autorización del cargo con un token de un solo uso</text>
    </g>
  </g>
  <g data-id="assess" data-role="relation">
