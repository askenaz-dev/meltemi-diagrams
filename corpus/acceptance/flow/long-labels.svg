    <path d="M2179 48 L2171 51.5 L2171 44.5 Z" fill="#526579" stroke="none" stroke-width="0"/>
    <g data-id="approve" data-role="label">
      <rect x="1793.46" y="39" width="283.93" height="18" rx="9" fill="#FFFFFF" stroke="#DCE5ED" stroke-width="1"/>
      <text x="1935.42" y="52" text-anchor="middle" font-size="11" font-weight="500" fill="#0B1830">Aprobado automáticamente por las reglas de riesgo</text>
    </g>
  </g>
  <g data-id="hold" data-role="relation">
    <polyline points="1691.8,74.67 1775,74.67 1775,116 2775,116 2775,69.33 2817,69.33" fill="none" stroke="#526579" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 4"/>
    <path d="M2825 69.33 L2817 72.83 L2817 65.83 Z" fill="#526579" stroke="none" stroke-width="0"/>
    <g data-id="hold" data-role="label">
      <rect x="2167.05" y="107" width="188.04" height="18" rx="9" fill="#FFFFFF" stroke="#DCE5ED" stroke-width="1"/>
      <text x="2261.07" y="120" text-anchor="middle" font-size="11" font-weight="500" fill="#0B1830">Pendiente de conciliación manual</text>
    </g>
  </g>
  <g data-id="settle" data-role="relation">
    <polyline points="2503,48 2817,48" fill="none" stroke="#526579" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M2825 48 L2817 51.5 L2817 44.5 Z" fill="#526579" stroke="none" stroke-width="0"/>
    <g data-id="settle" data-role="label">
      <rect x="2573.36" y="39" width="181.27" height="18" rx="9" fill="#FFFFFF" stroke="#DCE5ED" stroke-width="1"/>
      <text x="2664" y="52" text-anchor="middle" font-size="11" font-weight="500" fill="#0B1830">Confirma la liquidación del pago</text>
    </g>
  </g>
  <g data-id="frame" data-role="frame">
    <polyline points="20,190.5 3118,190.5" fill="none" stroke="#DCE5ED" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
    <g data-id="mark" data-role="frame" transform="translate(20 200) scale(0.0938)">
      <path d="M43 178C43 125 57 100 78 100C99 100 109 127 109 176C109 105 132 67 158 67C185 67 199 97 196 132C194 154 185 169 172 177C189 176 205 166 217 152C224 144 230 133 234 122" fill="none" stroke="url(#meltemi-wind)" stroke-width="25" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M45 199C87 211 145 215 202 189C195 204 177 216 151 220C106 226 67 215 45 199Z" fill="url(#meltemi-wind)" stroke="none" stroke-width="0"/>
    </g>
    <text x="52" y="216.37" text-anchor="start" font-size="12" font-weight="600" fill="#0B1830">Meltemi Diagrams</text>
    <text x="3118" y="216" text-anchor="end" font-size="11" font-weight="400" fill="#526579">Integración de pagos con proveedores externos</text>
  </g>
