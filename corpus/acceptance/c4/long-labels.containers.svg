      <text x="1226" y="113.17" text-anchor="middle" font-size="11" font-weight="500" fill="#0B1830">Solicita devoluciones parciales y totales</text>
      <text x="1226" y="123.44" text-anchor="middle" font-size="9" font-weight="400" fill="#526579">[HTTPS y JSON con firma]</text>
    </g>
  </g>
  <g data-id="record" data-role="relation">
