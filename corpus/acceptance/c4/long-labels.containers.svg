<svg xmlns="http://www.w3.org/2000/svg" width="2913" height="268" viewBox="0 0 2913 268" font-family="&quot;Inter&quot;, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif">
  <title>Contenedores de la plataforma de pagos</title>
  <defs>
    <linearGradient id="meltemi-wind" gradientUnits="userSpaceOnUse" x1="38" y1="222" x2="219" y2="54">
      <stop offset="0" stop-color="#1D4ED8"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="2913" height="268" fill="#F7FBFF"/>
  <g data-id="platform" data-role="element">
    <rect x="671" y="20" width="1623" height="148.67" rx="14" fill="#EAF1F8" stroke="#526579" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="691" y="42.73" text-anchor="start" font-size="13" font-weight="600" fill="#0B1830">Plataforma de pagos y conciliación [Software System]</text>
  </g>
  <g data-id="merchant" data-role="element">
    <rect x="20" y="88.27" width="242" height="78.4" rx="24" fill="#0891B2" stroke="#0891B2" stroke-width="1"/>
    <path d="M125 78.67 A16 16 0 1 0 157 78.67 A16 16 0 1 0 125 78.67 Z" fill="#0891B2" stroke="#0891B2" stroke-width="1"/>
    <text x="141" y="121" text-anchor="middle" font-size="13" font-weight="600" fill="#FFFFFF">Comercio con varias sucursales</text>
    <text x="141" y="138.27" text-anchor="middle" font-size="11" font-weight="400" fill="#FFFFFF">[Person]</text>
    <text x="141" y="154.27" text-anchor="middle" font-size="11" font-weight="400" fill="#FFFFFF">Cobra a sus clientes en tienda y en línea</text>
  </g>
  <g data-id="platform.portal" data-role="element">
    <rect x="687" y="76.67" width="358" height="76" rx="8" fill="#0369A1" stroke="#0369A1" stroke-width="1"/>
    <text x="866" y="111.4" text-anchor="middle" font-size="13" font-weight="600" fill="#FFFFFF">Portal de administración del comercio</text>
    <text x="866" y="128.67" text-anchor="middle" font-size="11" font-weight="400" fill="#FFFFFF">[Container: TypeScript y React con renderizado en el servidor]</text>
  </g>
  <g data-id="platform.processor" data-role="element">
    <rect x="1407" y="76.67" width="298" height="76" rx="8" fill="#0369A1" stroke="#0369A1" stroke-width="1"/>
