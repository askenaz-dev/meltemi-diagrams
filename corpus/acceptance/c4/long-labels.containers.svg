    <text x="1556" y="128.67" text-anchor="middle" font-size="11" font-weight="400" fill="#FFFFFF">[Container: Kotlin sobre la máquina virtual de Java]</text>
  </g>
  <g data-id="platform.ledger" data-role="element">
    <path d="M1993 68 L1993 136 A142.5 8 0 0 0 2278 136 L2278 68 A142.5 8 0 0 1 1993 68 Z" fill="#0369A1" stroke="#0369A1" stroke-width="1"/>
    <path d="M1993 68 A142.5 8 0 0 1 2278 68 A142.5 8 0 0 1 1993 68 Z" fill="#0369A1" stroke="#0369A1" stroke-width="1"/>
    <text x="2135.5" y="102.73" text-anchor="middle" font-size="13" font-weight="600" fill="#FFFFFF">Libro mayor de movimientos conciliados</text>
    <text x="2135.5" y="120" text-anchor="middle" font-size="11" font-weight="400" fill="#FFFFFF">[Container: PostgreSQL con réplicas de lectura]</text>
  </g>
  <g data-id="acquirer" data-role="element">
    <rect x="2645" y="124" width="248" height="80" rx="8" fill="#526579" stroke="#526579" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="2769" y="152.73" text-anchor="middle" font-size="13" font-weight="600" fill="#FFFFFF">Banco adquirente y red de tarjetas</text>
    <text x="2769" y="170" text-anchor="middle" font-size="11" font-weight="400" fill="#FFFFFF">[External Software System]</text>
    <text x="2769" y="186" text-anchor="middle" font-size="11" font-weight="400" fill="#FFFFFF">Autoriza y liquida los cargos con tarjeta</text>
  </g>
