<svg xmlns="http://www.w3.org/2000/svg" width="722" height="216" viewBox="0 0 722 216" font-family="&quot;Inter&quot;, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif">
  <defs>
